name: ArtCraft official GitHub package sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: artcraft-official-sync
  cancel-in-progress: false

jobs:
  sync-official-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out ArtCraft preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/artcraft-space-latest-interface-20261117

      - name: Download official ArtCraft GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, urllib.request, zipfile
          apps = [
            ("photocraft","web"),("vectorcraft","web"),("filmcraft","web"),
            ("lightcraft","web"),("pdfcraft","web"),("effectcraft","web"),
            ("anicraft","web"),("designcraft","web"),("figcraft","web"),
            ("texturecraft","web"),("materialcraft","web"),("soundcraft","web"),
            ("wordcraft","web"),("deckcraft","web"),("cadcraft","web"),
            ("gridcraft","web"),("craft-anything","web")
          ]
          root=pathlib.Path("artcraft-release-assets"); root.mkdir(exist_ok=True)
          manifest={"source_organization":"https://github.com/storytold","release_tag":"artcraft-bundles","max_package_bytes":2*1024*1024*1024,"packages":[]}
          for app, platform in apps:
            api=f"https://api.github.com/repos/storytold/{app}/releases/latest"
            req=urllib.request.Request(api,headers={"Accept":"application/vnd.github+json","User-Agent":"Pelex-ArtCraft-Sync"})
            try:
              with urllib.request.urlopen(req,timeout=30) as response: release=json.load(response)
            except Exception as e:
              manifest["packages"].append({"id":app,"platform":platform,"validated":False,"status":"official_release_unavailable","detail":str(e)})
              continue
            assets=release.get("assets",[])
            selected=[a for a in assets if re.fullmatch(re.escape(app)+r"-web-[^/]+\.zip",a["name"],re.I)]
            if not selected and app=="filmcraft":
              selected=[a for a in assets if re.fullmatch(r"filmcraft-[^/]+-windows-x64-portable\.zip",a["name"],re.I)]
              platform="desktop"
            if not selected:
              manifest["packages"].append({"id":app,"platform":platform,"version":release.get("tag_name"),"source_repo":f"https://github.com/storytold/{app}","validated":False,"status":"no_official_web_release_asset"})
              print(f"NO WEB RELEASE ASSET: {app} ({release.get('tag_name')})")
              continue
            asset=selected[0]; size=int(asset.get("size",0))
            if size>2*1024*1024*1024:
              raise SystemExit(f"{app}: official release asset exceeds 2 GiB")
            target=root/f"{app}.zip"
            req=urllib.request.Request(asset["browser_download_url"],headers={"User-Agent":"Pelex-ArtCraft-Sync"})
            h=hashlib.sha256(); total=0
            with urllib.request.urlopen(req,timeout=90) as response,target.open("wb") as dest:
              if not response.geturl().startswith("https://"): raise SystemExit(f"{app}: non-HTTPS redirect rejected")
              while True:
                chunk=response.read(8*1024*1024)
                if not chunk: break
                total+=len(chunk)
                if total>2*1024*1024*1024: raise SystemExit(f"{app}: download exceeds 2 GiB")
                h.update(chunk); dest.write(chunk)
            if size and total!=size: raise SystemExit(f"{app}: size mismatch: expected {size}, got {total}")
            if not zipfile.is_zipfile(target): raise SystemExit(f"{app}: official asset is not a ZIP")
            with zipfile.ZipFile(target) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f"{app}: ZIP CRC failure at {bad}")
              for item in z.infolist():
                p=pathlib.PurePosixPath(item.filename)
                if p.is_absolute() or ".." in p.parts: raise SystemExit(f"{app}: unsafe ZIP path {item.filename}")
              names=[x.filename.lower() for x in z.infolist() if not x.is_dir()]
              if platform=="web" and not any(pathlib.PurePosixPath(n).name=="index.html" for n in names):
                raise SystemExit(f"{app}: browser ZIP has no index.html")
            record={"id":app,"platform":platform,"version":release.get("tag_name"),"file":target.name,"bytes":total,"sha256":h.hexdigest(),"source_repo":f"https://github.com/storytold/{app}","source_url":asset["browser_download_url"],"validated":True,"status":"ready"}
            manifest["packages"].append(record)
            print(f"READY {app} {record['version']} ({total} bytes)")
          (root/"package-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY

      - name: Publish official binaries as GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view artcraft-bundles >/dev/null 2>&1; then
            echo "Updating ArtCraft binary release"
          else
            gh release create artcraft-bundles --title "ArtCraft official app packages" --notes "Mirrored, validated release binaries downloaded directly from the official storytold GitHub repositories. Browser packages are WebAssembly builds. FilmCraft is desktop-only where no browser bundle is published. Each individual asset is limited to 2 GiB."
          fi
          gh release upload artcraft-bundles artcraft-release-assets/*.zip artcraft-release-assets/package-manifest.json --clobber

      - name: Publish manifest for ArtCraft frontend
        run: |
          mkdir -p public/artcraft
          cp artcraft-release-assets/package-manifest.json public/artcraft/package-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/artcraft/package-manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged"
          else
            git commit -m "Sync official ArtCraft app package manifest"
            git push origin HEAD:preview/artcraft-space-latest-interface-20261117
          fi
